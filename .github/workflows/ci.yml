name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Version matches CHANGELOG
        run: |
          manifest=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          changelog=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "marketplace.json $manifest · CHANGELOG $changelog"
          test "$manifest" = "$changelog"

      - name: Validate vendored plugins
        run: for p in plugins/*/; do echo "== $p"; claude plugin validate "$p"; done

      - name: Shellcheck scripts
        run: find scripts plugins -name '*.sh' -print0 | xargs -0 -r shellcheck
