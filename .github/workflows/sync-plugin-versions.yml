name: Sync plugin versions

# Keeps marketplace.json's plugin versions in step with the plugins themselves.
# Every plugin lives in its own repo, whose release.yml sends a `plugin-released`
# repository_dispatch from its main branch with { name, version }. Each sync
# bumps metadata.version (patch) and adds a CHANGELOG entry, then commits
# straight to main. See scripts/sync-plugin-version.sh.

on:
  repository_dispatch:
    types: [plugin-released]
  workflow_dispatch:
    inputs:
      name:
        description: Plugin name (as listed in marketplace.json)
        required: true
      version:
        description: Version to set (the plugin repo's plugin.json version)
        required: true

permissions:
  contents: write

# One sync at a time, never cancelled: two releases landing together both apply.
concurrency:
  group: sync-plugin-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply version
        env:
          # Read via env, never interpolated into the script (dispatch payloads are input).
          PAYLOAD_NAME: ${{ github.event.client_payload.name || inputs.name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: scripts/sync-plugin-version.sh "$PAYLOAD_NAME" "$PAYLOAD_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate before pushing
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Commit and push
        run: |
          if git diff --quiet; then echo "Nothing to sync."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          git commit -am "chore: sync plugin versions (v$version)" -m "Triggered by ${{ github.event_name }}."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
